data:
  options_dir: data/raw
  spot_dir: data/nifty_spot
  output_dir: output/reclaim_continuation_v322
  candle_minutes: 5
strategy:
  version: "3.2.2"
  name: Sweet Spot v3.2.2 Reclaim + Continuation
  strike_step: 50
  universe:
    mode: offsets
    offsets: [0]
  allowed_option_types: [CE, PE]
  trade_start_time: "09:20"
  trade_end_time: "15:00"
  squareoff_time: "15:25"
  ema_period: 20
  vix_file: data/INDIA_VIX_5minute_2025-04-01_to_2026-06-26.csv

  # Strict first pivot breakout.
  max_entry_distance_from_pivot: 20
  max_entry_candle_range: 13
  min_entry_body_ratio: 0.35
  min_entry_close_position: 0.60
  max_pre_entry_move_from_day_low: 35

  # VIX is not a global hard skip. It only blocks sharply falling VIX + weak structure.
  strong_body_ratio: 0.50
  strong_close_position: 0.70

  # Fresh reclaim.
  reclaim_wait_candles: 2
  reclaim_max_entry_distance: 30
  reclaim_max_candle_range: 18
  max_trades_per_side_per_day: 3

  # Wide reclaim / ignition after washout. This is for 2-Jun type candles:
  # candle range is wide, but it starts from a washout/base and closes strongly above pivot.
  enable_ignition_reclaim: true
  ignition_start_time: "10:00"
  ignition_max_entry_distance: 30
  ignition_max_candle_range: 70
  ignition_min_body_ratio: 0.60
  ignition_min_close_position: 0.70

  # Continuation/base breakout.
  continuation_max_entry_distance: 40
  continuation_max_candle_range: 18
  continuation_max_distance_from_base_low: 20

  # Side switch.
  side_switch_max_entry_distance: 30
  side_switch_max_candle_range: 18
  max_side_switches_per_day: 1

  # Exits.
  c2c_trigger: 20
  c2c_exit_mode: close_below_entry
  trailing_trigger: 40
  daily_risk:
    max_pivot_close_sl: 4
    max_daily_loss: 60
probability_filter:
  enabled: false
  min_probability_20: 0.0
